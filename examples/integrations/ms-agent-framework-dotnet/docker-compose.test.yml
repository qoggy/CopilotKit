# Docker Compose stack for e2e smoke testing with aimock.
# Mirrors the user experience: Next.js frontend + .NET agent + aimock as LLM.
# The .NET agent uses GitHubToken + models.inference.ai.azure.com endpoint,
# but for testing we redirect to aimock via OPENAI_BASE_URL override.
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  aimock:
    image: ghcr.io/copilotkit/aimock:latest
    ports:
      - "4010:4010"
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["--fixtures", "/fixtures", "--host", "0.0.0.0"]

  agent:
    build:
      context: ./agent
      dockerfile: ../docker/Dockerfile.agent
    ports:
      - "8000:8000"
    environment:
      - GitHubToken=test-key-for-aimock
      - OPENAI_BASE_URL=http://aimock:4010/v1
    depends_on:
      aimock:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      - AGENT_URL=http://agent:8000
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
